name: forgebox
version: 0.1.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.6"
description: >-
  Try-then-commit Git worktree workflow. Best-effort hooks redirect known
  file-path arguments and command working directories, and journal tool
  results. This is not an OS sandbox and does not contain shell writes.
  Review and apply changes explicitly with forgebox apply or the
  dashboard/Desktop panel.
license: MIT
homepage: https://github.com/nosliwhtes/forgebox
tags: [automation, git, safety, desktop]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_approval_response

